<header class="nav">
    <div class="nav-in">
        <a class="logo" routerLink="/publicaciones">PADD<b>O</b>CK</a>

        <nav class="nav-links">
            <a routerLink="/publicaciones" routerLinkActive="activo">Publicaciones</a>
            <a routerLink="/mi-perfil" routerLinkActive="activo">Mi perfil</a>

            <ng-container *appSoloAdmin>
                <a routerLink="/dashboard/usuarios" routerLinkActive="activo">Usuarios</a>
                <a routerLink="/dashboard/estadisticas" routerLinkActive="activo">Estadísticas</a>
            </ng-container>

        </nav>

        @if (usuario(); as u) {
            <div class="yo" [appColorEquipo]="u.equipoFavorito">
                @if (u.imagenUrl) {
                    <img class="avatar" appImagenRespaldo [src]="u.imagenUrl" [alt]="u.nombreUsuario" />
                } @else {
                    <div class="avatar">{{ u | iniciales }}</div>
                }
                <span>&#64;{{ u.nombreUsuario }}</span>
            </div>
        }

        <button class="btn btn-sm" type="button" (click)="salir()">Salir</button>
    </div>
</header>
